<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos da comunidade | DoAção</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <a class="marca" href="./index.html" aria-label="DoAção">♥</a>
      <button class="ajuda" type="button">▤ Tire dúvidas</button>
    </header>

    <section class="cabecalho">
      <span>Conecte-se para transformar</span>
      <h1>Comunidade</h1>
      <p>Encontre campanhas próximas e mobilize pessoas para doar.</p>
    </section>

    <nav class="abas" aria-label="Seções da comunidade">
      <a href="#">Feed</a>
      <a class="ativa" href="./index.html">Eventos</a>
      <a href="#">Fórum</a>
    </nav>

    <a class="criar-evento" href="./cadastro.html">＋ Criar evento</a>

    <label class="busca">
      <span aria-hidden="true">⌕</span>
      <input id="busca-eventos" type="search" placeholder="Buscar eventos por nome ou local">
    </label>

    <div class="titulo-lista">
      <div>
        <span>Agenda da comunidade</span>
        <h2>Próximos eventos</h2>
      </div>
      <strong id="contador-eventos">Carregando...</strong>
    </div>

    <section id="lista-eventos" class="lista-eventos" aria-live="polite"></section>
  </main>

  <script type="module" src="./js/eventos.js"></script>
</body>
</html>
