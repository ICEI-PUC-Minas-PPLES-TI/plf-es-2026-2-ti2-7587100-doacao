# Permissoes do RESTHeart (acl authorizer)
permissions:
  # admin pode tudo
  - role: admin
    predicate: path-prefix('/')
    priority: 0
  # obs: qualquer pessoa pode alterar, com ou sem login
  # TEMOS QUE ALTERAR QUANDO HOSPEDAR
  # ANTES DE HOSPEDAR tem que restringir 
  - role: $unauthenticated
    predicate: path-prefix('/')
    priority: 10
