<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar evento | DoAção</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <a class="marca" href="#" aria-label="DoAção">♥</a>
      <button class="ajuda" type="button">▤ Tire dúvidas</button>
    </header>

    <section class="cabecalho">
      <span>Comunidade</span>
      <h1>Criar evento</h1>
      <p>Preencha os dados para divulgar uma ação de doação de sangue.</p>
    </section>

    <form id="form-evento" class="formulario" novalidate>
      <label>
        Nome do evento
        <input name="nome" type="text" placeholder="Ex.: Mutirão de doação">
        <small data-erro="nome"></small>
      </label>

      <label>
        Descrição
        <textarea name="descricao" rows="4" placeholder="Conte brevemente como será o evento"></textarea>
      </label>

      <div class="linha">
        <label>
          Data
          <input name="data" type="date">
          <small data-erro="data"></small>
        </label>

        <label>
          Horário
          <input name="horario" type="time">
          <small data-erro="horario"></small>
        </label>
      </div>

      <label>
        Local
        <input name="local" type="text" placeholder="Cidade ou endereço">
        <small data-erro="local"></small>
      </label>

      <p id="mensagem-sucesso" class="sucesso" role="status" hidden>Evento salvo com sucesso.</p>

      <div class="acoes">
        <button class="secundario" type="reset">Cancelar</button>
        <button class="primario" type="submit">Salvar evento</button>
      </div>
    </form>
  </main>

  <script type="module" src="./js/eventos.js"></script>
</body>
</html>
