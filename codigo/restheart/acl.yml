# Permissoes do RESTHeart (fileAclAuthorizer). Maior priority e avaliada primeiro.
permissions:
  # admin pode tudo
  - role: admin
    predicate: path-prefix('/')
    priority: 0
  # qualquer pessoa, sem login, pode apenas LER os centros de coleta
  - role: $unauthenticated
    predicate: method(GET) and path-prefix('/centros')
    priority: 10
  # Somente consulta de eventos. Não libera documentos individuais, agregações ou gravação.
  - roles: ['$unauthenticated']
    predicate: method(GET) and path('/publicacoes') and qparams-whitelist(filter, page, pagesize, sort)
    priority: 100
    mongo:
      readFilter: '{"tipo": "EVENTO"}'
      projectResponse: >-
        {"_id": 1, "tipo": 1, "titulo": 1, "texto": 1, "inicio": 1,
         "localNome": 1, "endereco": 1,
         "totalParticipantes": 1}
